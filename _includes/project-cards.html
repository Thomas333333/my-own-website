<div class="project-grid">{% for project in site.data.projects %}<article class="project-card"><div class="project-card-content"><h3><a href="{{ root | append: '/projects/' | append: project.id | append: '/' | relative_url }}">{{ project.subtitle[lang] }}</a></h3><p>{{ project.summary[lang] }}</p><div class="project-status">{{ project.status[lang] }}</div><a class="text-link" href="{{ root | append: '/projects/' | append: project.id | append: '/' | relative_url }}">{% if lang == 'en' %}Project details{% else %}查看项目{% endif %} <span>↗</span></a></div></article>{% endfor %}</div>
